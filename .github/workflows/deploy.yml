name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一条部署，新推送取消进行中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:prod
        env:
          # Project pages 部署在 <user>.github.io/<repo>/ 下，base 从仓库名推导
          APP_BASE_PATH: /${{ github.event.repository.name }}/

      # umi 构建产物输出到 dist/<mode>（即 dist/prod）
      # GitHub Pages 不支持 SPA 回退：复制 index.html 为 404.html，深链刷新时由 404.html 载入 SPA 后由前端路由接管
      - name: SPA fallback
        run: cp dist/prod/index.html dist/prod/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/prod

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
